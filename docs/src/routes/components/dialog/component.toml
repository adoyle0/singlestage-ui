name = "Dialog"
description = "A window overlaid on either the primary window or another dialog window, rendering the content underneath inert."

[[examples]]
name = "Dialog"

[[examples]]
name = "Dialog custom close button"
title = "Custom Close Button"
description = "Replace the default close control with your own button."

[[examples]]
name = "Dialog no close button"
title = "No Close Button"
description = "Use close_button=false to hide the close button."

[[examples]]
name = "Dialog sticky footer"
title = "Sticky Footer"
description = "Keep actions visible while the content scrolls."

[[examples]]
name = "Dialog scrollable content"
title = "Scrollable Content"
description = "Long content can scroll while the header stays in view."

[[references]]
name = "Dialog"
description = "Contains all the parts of a Dialog component."
extra = """Implements <a class="singlestage-link" \
href="https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Global_attributes">global</a> \
and <a class="singlestage-link" \
href="https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/dialog#attributes">dialog</a> \
attributes."""
attrs = [
  { attr = "open", attr_type = "bool", default = "false", description = """Reactive signal that \
    can remotely control the open state of the popover **but is not coupled to the actual open \
    state of the popover**""" },
]

