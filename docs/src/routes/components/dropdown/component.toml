[[references]]
name = "DropdownMenu"
description = "Contains all the parts of a dropdown menu."
extra = """Implements <a class="singlestage-link" \
href="https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Global_attributes">global</a> \
attributes."""
attrs = [
  { attr = "modal", attr_type = "bool", default = "false", description = """Set whether or not \
    this popover should be modal meaning it can't be light dismissed Use this along with the open \
    signal for a manually managed popover""" },
  { attr = "open", attr_type = "bool", default = "false", description = """Reactive signal that \
    can remotely control the open state of the popover **but is not coupled to the actual open \
    state of the popover** unless modal is set to true""" },
]

[[references]]
name = "DropdownMenuCheckboxGroup"
description = "A checkbox group component for dropdown menus."
extra = """Implements <a class="singlestage-link" \
href="https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Global_attributes">global</a> \
and <a class="singlestage-link" \
href="https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/fieldset#attributes">fieldset</a> \
attributes."""
attrs = [
  { attr = "invalid", attr_type = "bool", default = "false", description = """A reactive signal \
    that toggles whether all the children Checkboxes appear invalid or not.""" },
  { attr = "value", attr_type = "Vec<String>", default = "[]", description = """A dynamic list of \
    all the values of checked children Checkboxes.""" },
]

[[references]]
name = "DropdownMenuCheckboxItem"
description = "A checkbox item for dropdown menus."
extra = """Implements <a class="singlestage-link" \
href="https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Global_attributes">global</a> \
and <a class="singlestage-link" \
href="https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/li#attributes">li</a> \
attributes."""
attrs = [
  { attr = "checked", attr_type = "bool", default = "false", description = """A reactive signal \
    coupled to the checkbox's checked value.""" },
  { attr = "disabled", attr_type = "bool", default = "false", description = """Controls \
    whether the item appears disabled or not.""" },
  { attr = "dismiss", attr_type = "bool", default = "true", description = """Toggle whether \
    clicking this item dismisses the parent menu.""" },
  { attr = "inset", attr_type = "bool", default = "false", description = """Set whether or not \
    this element should display inset from its normal position.""" },
  { attr = "variant", attr_type = "String", default = """""""", description = """Set the display \
    variant of the item. Accepted values: \"destructive\".""" },
]

