[[references]]
name = "Tabs"
description = "Contains all the tabs component parts."
extra = """Implements <a class="singlestage-link" \
href="https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Global_attributes">global</a> \
attributes."""
attrs = [
  { attr = "orientation", attr_type = "String", default = """"horizontal"""", description = """Set \
    which direction the tabs should flow. Accepted values: "horizontal" | "vertical".""" },
  { attr = "value", attr_type = "Reactive<String>", default = """""""", description = """Reactive \
    signal coupled to the `value` of the current selected tab.""" },
]

[[references]]
name = "TabsContent"
description = "Contains the content associated with each trigger."
extra = """Implements <a class="singlestage-link" \
href="https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Global_attributes">global</a> \
attributes."""
attrs = [
  { attr = "value", attr_type = "String", default = """""""", description = """This tab's trigger \
    value.""" },
]

[[references]]
name = "TabsList"
description = "Contains the triggers that are aligned along the edge of the active content."
extra = """Implements <a class="singlestage-link" \
href="https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Global_attributes">global</a> \
attributes."""
attrs = [
  { attr = "variant", attr_type = "String", default = """"default"""", description = """Set the \
    display variant of the tab buttons. Accepted values: "default" | "line".""" },
]

[[references]]
name = "TabsTrigger"
description = "The button that activates its associated content."
extra = """Implements <a class="singlestage-link" \
