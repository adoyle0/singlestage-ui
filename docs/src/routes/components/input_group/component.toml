name = "Input Group"
description = """Add additional information or actions to an input or textarea."""

[[examples]]
name = "input group"

[[examples]]
name = "input group inline start"
title = "Inline Start"
descruotion = "Position the addon at the start of the input. This is the default."

[[examples]]
name = "input group inline end"
title = "Inline End"
descruotion = "Position the addon at the end of the input."

[[examples]]
name = "input group block start"
title = "Block Start"
descruotion = "Position the addon above the input."

[[examples]]
name = "input group block end"
title = "Block End"
descruotion = "Position the addon below the input."

[[examples]]
name = "input group icon"
title = "Icon"
description = "Display icons within input groups."

[[examples]]
name = "input group text"
title = "Text"
description = "Display additional text information alongside inputs."

[[examples]]
name = "input group button"
title = "Button"
description = "Add buttons to perform actions within the input group."

[[examples]]
name = "input group kbd"
title = "Kbd"
description = "Display a keyboard shortcut associated with the input."

[[examples]]
name = "input group dropdown"
title = "Dropdown"
description = "Pair input groups with dropdown menus for complex interactions."

[[examples]]
name = "input group spinner"
title = "Spinner"
description = "Show loading indicators while processing input."

[[examples]]
name = "input group textarea"
title = "Textarea"
description = """Input groups also work with textarea components. Use block-start or block-end \
for alignment."""

[[examples]]
name = "input group tooltip"
title = "Tooltip"
description = "Add Add tooltips to provide additional context or help."

[[examples]]
name = "input group label"
title = "Label"
description = "Add labels within input groups to improve accessibility."

[[examples]]
name = "input group button group"
title = "Button Group"
description = "Wrap input groups with button groups to create prefixes and suffixes."

[[references]]
name = "InputGroup"
description = "The main component that wraps inputs and addons."
extra = """Implements <a class="singlestage-link" \
href="https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Global_attributes">global</a> \
attributes."""
attrs = [
  { attr = "disabled", attr_type = "bool", default = "false", description = """Toggle whether or \
    not this input group should appear disabled.""" },
]

[[references]]
name = "InputGroupAddon"
description = "Displays icons, text, buttons, or other content alongside inputs."
extra = """Implements <a class="singlestage-link" \
href="https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Global_attributes">global</a> \
attributes."""
attrs = [
  { attr = "align", attr_type = "String", default = "\"inline-start\"", description = """Set how \
    child content should be aligned. Accepted values are inline-start | inline-end | block-start \
    | block-end.""" },
]

[[references]]
name = "InputGroupText"
description = "A styled wrapper for displaying text and icons in an InputGroup."
extra = """Implements <a class="singlestage-link" \
href="https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Global_attributes">global</a> \
attributes."""
attrs = []
