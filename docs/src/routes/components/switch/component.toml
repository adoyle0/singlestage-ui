name = "switch"
description = "A control that allows the user to toggle between checked and not checked."

[[examples]]
name = "switch"

[[examples]]
name = "switch_group"
title = "Checkbox Group"
description = "Since a Switch is a Checkbox underneath, it can also be used in a CheckboxGroup."

[[examples]]
name = "switch_description"
title = "Description"

[[examples]]
name = "switch_choice_card"
title = "Choice Card"
description = """Card-style selection where FieldLabel wraps the entire Field for a clickable \
card pattern."""

[[examples]]
name = "switch_disabled"
title = "Disabled"
