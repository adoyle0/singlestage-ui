[[references]]
name = "Sidebar"
description = "The main collapsible sidebar panel."
extra = """Implements <a class="singlestage-link" \
href="https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Global_attributes">global</a> \
attributes."""
attrs = [
  { attr = "collapsible", attr_type = "String", default = """"offcanvas"""", description = """Set \
    how the sidebar should collapse.""" },
  { attr = "default_open", attr_type = "bool", default = "depends", description = """Set the \
    default open state of the sidebar. This defaults to true on large screens and false on small \
    screens""" },
  { attr = "side", attr_type = "String", default = """"left"""", description = """Set which side \
    of the screen the sidebar renders on.""" },
  { attr = "variant", attr_type = "String", default = """"sidebar"""", description = """Set which \
    variant of sidebar to render.""" },
]

