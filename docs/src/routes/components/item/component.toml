name = "Item"
description = """A versatile component for displaying content with media, title, description, and \
actions."""

[[examples]]
name = "Item"

[[examples]]
name = "item variants"
title = "Variants"
description = "Use the variant prop to change the visual style of the item."

[[examples]]
name = "item size"
title = "Size"
description = """Use the size prop to change the size of the item. Available sizes are default, \
sm, and xs."""

[[examples]]
name = "item icon"
title = "Icon"
description = "Use the ItemMedia icon variant to display an icon."

[[examples]]
name = "item avatar"
title = "Avatar"

[[examples]]
name = "item image"
title = "Image"
description = "Use the ItemMedia image variant to display an icon."

[[examples]]
name = "item group"
title = "Group"
description = "Use ItemGroup to group related items together."

[[examples]]
name = "item header"
title = "Header"
description = "Use ItemHeader to add a header above the item content."

[[examples]]
name = "item link"
title = "Link"
description = """To make an Item a link, just wrap it with an anchor and it'll automatically \
apply hover and focus styling."""

[[examples]]
name = "item dropdown"
title = "Dropdown"

