[workspace]
members = ["docs", "docs_macro", "singlestage", "singlestage_macro"]
resolver = "2"

[workspace.package]
version = "0.5.0"
authors = ["Adam Doyle <adam@doordesk.net>"]
description = "A UI component library for Leptos based on Basecoat UI and shadcn/ui"
homepage = "https://singlestage.doordesk.net"
keywords = ["leptos", "ui", "components", "basecoat", "shadcn"]
categories = ["web-programming", "gui", "wasm"]
license = "MIT"
repository = "https://github.com/adoyle0/singlestage-ui"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
axum = "0.8"
console_error_panic_hook = "0.1"
icondata = "0.7"
leptos = "0.8"
leptos_axum = "0.8"
leptos_meta = "0.8"
leptos_router = "0.8"
quote = "1.0"
rayon = "1.11"
reactive_stores = "0.4"
reqwest = "0.13"
serde = "1.0"
sha256 = "1.6"
singlestage_macro = "0"
syn = "3.0"
syntect = "5"
tokio = "1"
toml = "1.0"
tower = "0.5"
tower-http = "0.7"
uuid = "1.17"
wasm-bindgen = "0.2"
web-sys = "0.3"

[profile.wasm-release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
inherits = "release"
