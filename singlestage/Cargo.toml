[package]
name = "singlestage"
readme = "../README.md"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
singlestage_macro = { workspace = true, optional = true }
reactive_stores = { workspace = true, optional = true }

leptos = { workspace = true }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }
serde = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v4", "js"] }
web-sys = { workspace = true, features = ["DomRect", "Element"] }

[build-dependencies]
rayon = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
sha256 = { workspace = true }

[features]
csr = ["leptos/csr"]
ssr = ["leptos/ssr"]
hydrate = ["leptos/hydrate"]
islands = ["serde/derive", "leptos/islands"]
nightly = ["leptos/nightly"]
stores = ["dep:reactive_stores"]
default = [
  "accordion",
  "alert",
  "alert_dialog",
  "aspect_ratio",
  "avatar",
  "badge",
  "breadcrumb",
  "button",
  "button_group",
  "card",
  "carousel",
  "checkbox",
  "collapsible",
  "context_menu",
  "dialog",
  "dropdown",
  "empty",
  "icon",
  "field",
  "input",
  "input_group",
  "item",
  "kbd",
  "label",
  "link",
  "pagination",
  "popover",
  "progress",
  "radio",
  "scroll_area",
  "select",
  "separator",
  "sheet",
  "sidebar",
  "skeleton",
  "slider",
  "spinner",
  "style_luma",
  "style_lyra",
  "style_maia",
  "style_mira",
  "style_nova",
  "style_sera",
  "style_vega",
  "switch",
  "table",
  "tabs",
  "textarea",
  "theme_provider",
  "toggle",
  "tooltip",
]

accordion = []
alert = []
alert_dialog = ["dialog"]
aspect_ratio = []
avatar = []
badge = []
breadcrumb = []
button = ["input_group"]
button_group = []
card = []
carousel = []
checkbox = ["field", "label"]
collapsible = []
context_menu = []
dialog = []
dropdown = ["popover"]
empty = []
icon = ["macro"]
field = []
input = ["field", "label"]
input_group = []
item = []
kbd = []
macro = ["dep:singlestage_macro"]
label = []
link = []
pagination = ["button"]
popover = []
progress = []
radio = ["field", "label"]
scroll_area = []
select = ["field"]
separator = []
sheet = ["button"]
sidebar = []
skeleton = []
slider = ["field", "label"]
spinner = []
style_luma = ["theme_provider"]
style_lyra = ["theme_provider"]
style_maia = ["theme_provider"]
style_mira = ["theme_provider"]
style_nova = ["theme_provider"]
style_sera = ["theme_provider"]
style_vega = ["theme_provider"]
switch = ["field", "checkbox", "label"]
table = []
tabs = []
textarea = ["field", "label"]
theme_provider = []
toggle = []
tooltip = []
